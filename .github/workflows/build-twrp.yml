name: Build TWRP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl unzip bc rsync zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig python3 python-is-python3
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install /tmp/repo /usr/local/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false

      - name: Sync TWRP source
        run: |
          mkdir -p /home/runner/twrp && cd /home/runner/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1 < /dev/null
          repo sync -c -j4 --no-clone-bundle --no-tags

      - name: Add device tree
        run: |
          unzip -q "$GITHUB_WORKSPACE/twrp_device_onn_t5100a_draft.zip" -d /tmp
          mkdir -p /home/runner/twrp/device/onn
          rm -rf /home/runner/twrp/device/onn/t5100a
          cp -r /tmp/t5100a /home/runner/twrp/device/onn/t5100a
          ls /home/runner/twrp/device/onn/t5100a

      - name: Build boot image
        run: |
          set +e
          cd /home/runner/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_t5100a-eng
          mka bootimage -j4 2>&1 | tee /home/runner/build.log
          test -f out/target/product/t5100a/boot.img

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-output
          path: |
            /home/runner/twrp/out/target/product/t5100a/boot.img
            /home/runner/build.log
          if-no-files-found: warn
